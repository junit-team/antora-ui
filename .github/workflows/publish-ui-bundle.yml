name: Publish UI bundle

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the bundle is unchanged
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download upstream bundle
        env:
          BUNDLE_URL: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
        run: curl --fail --location --output upstream.zip "$BUNDLE_URL"

      - name: Overlay supplemental UI
        run: |
          unzip -q upstream.zip -d bundle
          cp --recursive --dereference supplemental-ui/. bundle/
          find bundle -exec touch --date=@0 {} +
          (cd bundle && find . -type f | LC_ALL=C sort | zip --quiet --strip-extra ../ui-bundle.zip --names-stdin)

      - name: Publish release if bundle changed
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          PREV_TAG=$(gh release list --json tagName --jq 'map(.tagName) | sort | last // empty')
          if [ "$FORCE" != "true" ] && [ -n "$PREV_TAG" ] \
             && gh release download "$PREV_TAG" --pattern ui-bundle.zip.sha256 --output prev.sha256 2>/dev/null \
             && sha256sum --check --status prev.sha256; then
            echo "Bundle unchanged; skipping release."
            exit 0
          fi
          sha256sum ui-bundle.zip > ui-bundle.zip.sha256
          TAG=$(date --utc +'%Y%m%d-%H%M%S')
          gh release create "$TAG" ui-bundle.zip ui-bundle.zip.sha256 \
            --title "$TAG" \
            --notes 'Antora default UI (bundle-stable) with JUnit customizations.'
