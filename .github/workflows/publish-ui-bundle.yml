name: Publish UI bundle

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download upstream bundle
        env:
          BUNDLE_URL: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
        run: curl -fL -o upstream.zip "$BUNDLE_URL"

      - name: Overlay supplemental UI
        run: |
          unzip -q upstream.zip -d bundle
          # -L dereferences the vendor symlinks so real file content
          # (not broken links) ends up in the bundle.
          cp -rL supplemental-ui/. bundle/
          (cd bundle && zip -qr ../ui-bundle.zip .)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(date -u +'%Y%m%d-%H%M%S')
          gh release create "$TAG" ui-bundle.zip \
            --title "$TAG" \
            --notes "Antora default UI (bundle-stable) with JUnit customizations."
